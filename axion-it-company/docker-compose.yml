version: '3.8'

services:
  axion-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: Naipal-Singh-Saini-Company
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    volumes:
      - ./server/data:/app/server/data
